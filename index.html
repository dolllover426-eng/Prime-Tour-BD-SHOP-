  return '<h2>➕ টাকা অ্যাড করুন</h2><div class="card wal"><div class="mu">Wallet Balance</div><div class="amt"><small>Tk</small>'+me().bal+'</div></div><div class="card"><div class="mu">পেমেন্ট মেথড</div><div class="mt"><label><input type="radio" name="mt" checked><span>bKash</span></label><label><input type="radio" name="mt"><span>Nagad</span></label><label><input type="radio" name="mt"><span>Rocket</span></label></div><input id="am" type="number" inputmode="numeric" placeholder="টাকার পরিমাণ (সর্বনিম্ন ২০)"><input id="tx" placeholder="Transaction ID"><button class="b" onclick="addMoney()">অ্যাড মানি</button><p class="mu">পেমেন্ট নাম্বার: 01XXXXXXXXX (Send Money)</p></div>'+depH();
}
function addMoney(){
  var a=parseInt(document.getElementById("am").value,10),t=document.getElementById("tx").value.trim();
  if(!(a>=20))return toast("সর্বনিম্ন ২০ টাকা");
  if(t.length<6)return toast("সঠিক Transaction ID দিন");
  var u=me(),m=document.querySelector("input[name=mt]:checked").nextSibling.textContent;u.bal+=a;u.deps=u.deps||[];u.deps.unshift({m:m,a:a,id:t,t:new Date().toLocaleString("bn-BD")});save();toast("৳ "+a+" অ্যাড হয়েছে (ডেমো)");render();
}
var RK=[["Bronze","🥉",0,100],["Silver","🥈",101,1000],["Gold","🥇",1001,5000],["Platinum","💠",5001,10000],["Diamond","💎",10001,25000],["Heroic","🔥",25001,50000],["Master","👑",50001,100000],["Grand Master","🏆",100001,1e9]];
function spend(u){return u.orders.reduce(function(a,o){return a+o.pr},0)}
function rankIdx(sp){var r=0;RK.forEach(function(k,i){if(sp>=k[2])r=i});return r}
function fm(n){return n.toLocaleString("en-US")}
function rng(k){return k[3]>=1e9?fm(k[2]-1)+"+ Tk":fm(k[2])+" - "+fm(k[3])+" Tk"}
function profV(){
  var u=me(),sp=spend(u),ri=(u.rank!=null?u.rank:rankIdx(sp)),r=RK[ri],nx=RK[ri+1],pct=nx?Math.min(100,Math.max(1,Math.round((sp-r[2])/(r[3]-r[2]+1)*100))):100;
  var top='<div class="card pf"><div class="av big"'+avS(u)+'>'+avH(u)+'<i></i></div><h3>'+esc(u.name)+' '+(u.ver!==false?'<span class="ver">● Verified</span>':'')+'</h3><div class="pin">🛡️ Support PIN: '+u.pin+' '+(u.ver!==false?'&nbsp;★ Verified Account':'')+'</div>'+'<div class="card rbox"><span>'+r[1]+'</span><div><b style="font-size:18px">'+r[0]+' Member</b><div class="mu">Level '+(ri+1)+' / Current Rank</div></div></div>'+
  '<div class="card wal"><div class="row"><span class="mu" style="font-weight:600">Wallet Balance</span><button class="rf" onclick="render();toast(\'রিফ্রেশ হয়েছে\')">⟳</button></div><div class="amt"><small>Tk</small>'+u.bal+'</div><button class="b dk" onclick="go(\'money\')">Add Money</button></div></div>';
  var rank='<div class="rk"><div class="rkh"><span>'+r[1]+'</span><small>Level '+(ri+1)+'</small></div><div class="rkc">CURRENT RANK</div><div class="rkt">'+(ri?r[0]+" Member":"Start your journey from Bronze.")+'</div>'+
  '<div class="row" style="font-weight:700;margin-top:14px"><span>'+rng(r)+'</span><span>'+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>'+
  '<div class="rkn">'+(nx?'Need only <b>'+(nx[2]-sp)+' Tk</b> to unlock <b>'+nx[0]+'</b>':'You reached the top rank 🎉')+'</div>'+
  '<div class="prem"><b>✨ Unlock More Premium Products</b><p>Top up more to increase your Total Spend and Rank, then unlock premium products, low-rate topups, verified profile icons, and future VIP benefits.</p></div></div>';
  var list='<div class="card"><div class="eyb" style="margin-bottom:12px">RANK LEVELS</div>'+RK.map(function(k,i){return '<div class="row" style="padding:10px 0"><div style="display:flex;gap:12px;align-items:center"><span class="bd">'+k[1]+'</span><div><b style="font-size:17px">'+k[0]+'</b><div class="mu">'+rng(k)+'</div></div></div><span class="lkd'+(i<=ri?' ul2':'')+'">'+(i<ri?'✓ Unlocked':i==ri?'● Current':'🔒 Locked')+'</span></div>'}).join("")+'</div>';
  function inf(ic,l,v){return '<div class="inf"><span class="ib">'+ic+'</span><div><div class="mu" style="letter-spacing:.5px">'+l+'</div><b>'+esc(v||"—")+'</b></div></div>'}
  var info='<div class="card"><div class="eyb" style="margin-bottom:6px">ACCOUNT</div><h2 style="font-size:22px;margin-bottom:12px">User Information</h2>'+inf("👤","NAME",u.name)+inf("📞","PHONE",u.phone)+inf("✉️","EMAIL",u.email)+inf("🪪","USER ID",u.pin)+'</div>';
  return top+rank+list+info+'<button class="b lo" onclick="logout()">⎋ Logout</button>';
}
function logout(){
  sheet('<h2>Logout</h2><p class="mu">আপনি কি নিশ্চিত যে লগআউট করতে চান?</p><button class="b lo" onclick="closeM();mem.session=null;save();tab=\'home\';mode=\'login\';render();toast(\'লগআউট হয়েছে\')">হ্যাঁ, লগআউট</button><button class="b o" onclick="closeM()">বাতিল</button>');
}
function drawer(){
  var u=me(),m=document.createElement("div");m.className="modal";m.id="md";m.style.cssText="align-items:stretch;justify-content:flex-end";m.onclick=function(e){if(e.target==m)m.remove()};
  var I=[["🏠","My Account","profile"],["🔖","My Orders","orders"],["▦","My Codes","codes"],["☰","My Transaction","txn"],["➕","Add Money","money"]];
  m.innerHTML='<div class="drw"><div class="dh"><div class="av" style="border-radius:8px;width:64px;height:64px;font-size:28px'+(u.pic?';background:url('+u.pic+') center/cover':'')+'">'+avH(u)+'</div><div style="min-width:0"><b>Hi, '+esc(u.name)+'</b><div class="mu" style="overflow:hidden;text-overflow:ellipsis">'+esc(u.email)+'</div></div></div>'+
  I.map(function(i){return '<button class="di" onclick="closeM();go(\''+i[2]+'\')"><span>'+i[0]+'</span>'+i[1]+'</button>'}).join("")+
  '<button class="di" onclick="closeM();support()"><span>ⓘ</span>Contact Us</button><div style="padding:14px"><button class="b" onclick="closeM();support()">🎧 Support</button><button class="b lo" onclick="closeM();logout()">⎋ Logout</button></div></div>';
  document.body.appendChild(m);
}
function txnV(){
  var u=me(),d=u.deps||[],o=u.orders;
  var D=d.map(function(x){return '<div class="card" style="padding:12px"><div class="row"><b>+ ৳ '+x.a+' • '+esc(x.m)+'</b><span class="tag" style="background:rgba(22,163,74,.15);color:var(--ok)">Credit</span></div><div class="mu">TrxID: '+esc(x.id)+' • '+esc(x.t)+'</div></div>'}).join("");
  var O=o.map(function(x){return '<div class="card" style="padding:12px"><div class="row"><b>− ৳ '+x.pr+' • '+esc(x.n)+'</b><span class="tag">Debit</span></div><div class="mu">UID: '+esc(x.uid)+' • '+esc(x.t)+'</div></div>'}).join("");
  return '<h2>☰ My Transaction</h2>'+((D||O)?D+O:'')+((D||O)?'':'<p class="mu">এখনো কোনো ট্রানজ্যাকশন নেই।</p>');
}
function support(){
  var u=me(),L=[["tg","Telegram"],["wa","WhatsApp"],["fb","Messenger"]].filter(function(x){return SUP[x[0]]}).map(function(x){return '<a href="'+esc(SUP[x[0]])+'" target="_blank" rel="noopener" style="flex:1"><button class="b o" style="margin:0">'+x[1]+'</button></a>'}).join("");
  var T=u.tickets.map(function(t){return '<div class="card" style="padding:10px;margin:8px 0"><div class="mu">'+esc(t.t)+' • '+t.st+'</div>'+esc(t.m)+(t.r?'<div style="margin-top:6px;color:var(--pr)"><b>Admin:</b> '+esc(t.r)+'</div>':'')+'</div>'}).join("");
  sheet('<h2>🎧 সাপোর্ট</h2><div class="card">আপনার Support PIN: <b>'+u.pin+'</b><div class="mu">সাপোর্টে যোগাযোগের সময় এই PIN বলবেন।</div></div>'+(L?'<div class="row" style="gap:8px;margin-bottom:8px">'+L+'</div>':'')+
  '<textarea id="tm" rows="3" placeholder="আপনার সমস্যা লিখুন..."></textarea><button class="b" onclick="sendT()">মেসেজ পাঠান</button>'+(T?'<h2 style="margin-top:16px;font-size:16px">আপনার মেসেজ</h2>'+T:''));
}
function sendT(){
  var m=document.getElementById("tm").value.trim();
  if(m.length<5)return toast("সমস্যাটি একটু বিস্তারিত লিখুন");
  me().tickets.unshift({m:m,t:new Date().toLocaleString("bn-BD"),st:"Open"});save();closeM();support();toast("মেসেজ পাঠানো হয়েছে ✅");
}
load();render();pull();setInterval(pull,5000);document.addEventListener("visibilitychange",pull);
</script>
